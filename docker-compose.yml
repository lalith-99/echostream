# Local deployment. Published ports bind to loopback. Use managed secrets and
# TLS at your public ingress when deploying externally.
x-database-url: &database-url postgres://${DB_USER:-echostream}:${DB_PASSWORD:-echostream123}@postgres:5432/${DB_NAME:-echostream}?sslmode=disable
x-app-image: &app-image
  build: .

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-echostream}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-echostream123}
      POSTGRES_DB: ${DB_NAME:-echostream}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app-image
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-image
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ENV: development
      PORT: "8081"
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-only-echostream-development-secret}
      FRONTEND_BASE_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/v1/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
