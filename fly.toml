# Backend deployment template. Choose your own Fly application name.
app = "echostream-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/migrate"

[env]
  PORT = "8081"
  ENV = "production"
  LOG_LEVEL = "info"
  # Configure JWT_SECRET, DATABASE_URL, REDIS_URL, FRONTEND_BASE_URL and
  # CORS_ALLOWED_ORIGINS in your deployment environment.

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/v1/ready"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
