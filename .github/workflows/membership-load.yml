name: WebSocket membership comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - internal/repository/postgres/membership_batch.go
      - scripts/membership-load.sh
      - .github/workflows/membership-load.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure both revisions
        run: bash scripts/membership-load.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-comparison
          path: |
            membership-*.json
            membership-*-calls.txt
