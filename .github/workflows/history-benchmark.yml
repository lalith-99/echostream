name: History read benchmark
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/repository/postgres/message.go"
      - "internal/repository/postgres/history_load_test.go"
      - "scripts/history/**"
      - ".github/workflows/history-benchmark.yml"
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compare validated history pages against the original implementation
        run: bash scripts/history/run.sh | tee history-results.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: history-results
          path: history-results.txt
