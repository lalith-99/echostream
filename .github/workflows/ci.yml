name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  local-dependencies:
    name: Local Compose and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate default and frontend Compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile full config --quiet

      - name: Start local dependencies and apply migrations
        run: docker compose up -d --wait postgres redis

      - name: Verify the initialized schema
        run: |
          docker compose exec -T postgres psql -U echostream -d echostream -v ON_ERROR_STOP=1 <<'SQL'
          SELECT id, tenant_id, password_hash FROM users LIMIT 0;
          SELECT id, tenant_id, channel_id, sender_id, body FROM messages LIMIT 0;
          SELECT channel_id, user_id, role FROM channel_members LIMIT 0;
          SQL

      - name: Show dependency logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up disposable CI data
        if: always()
        run: docker compose down --volumes

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + bundle)
        run: npm run build

